<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Shopper Dashboard & Commission Management</title>
    <!-- Tailwind CSS CDN with Dark Mode Enabled -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0F172A',
                        cardBg: '#1E293B',
                        accentBlue: '#2563EB',
                        accentHover: '#1D4ED8',
                        borderSlate: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter / Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">

    <!-- Admin Quick-Return Bar (Appears when active admin session inspects shopper view) -->
    <div class="bg-rose-900/40 border-b border-rose-500/30 px-6 py-2.5 flex items-center justify-between text-xs z-50">
        <div class="flex items-center space-x-2 text-rose-300 font-medium">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin Control Mode: Inspecting Shopper Dashboard (index.html)</span>
        </div>
        <a href="admin.html" class="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-3 py-1.5 rounded-lg shadow transition flex items-center space-x-1.5">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Return to Admin Panel</span>
        </a>
    </div>

    <!-- Top Navigation Bar -->
    <header class="bg-cardBg border-b border-borderSlate sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <!-- EchoHub Brand Logo Icon -->
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-blue-500/20 relative">
                <i class="fa-solid fa-comment text-sm"></i>
                <div class="absolute -bottom-1 -left-1 w-3 h-3 bg-blue-600 transform rotate-45"></div>
            </div>
            <span class="font-heading text-xl font-bold tracking-wide text-white">Echo<span class="text-blue-500">Hub</span></span>
        </div>
        
        <!-- Navigation Links / Tabs -->
        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
            <a href="#" class="text-slate-300 hover:text-accentBlue transition flex items-center space-x-2"><i class="fa-solid fa-border-all"></i><span>Product Grid</span></a>
            <a href="index.html" class="text-accentBlue font-semibold flex items-center space-x-2"><i class="fa-solid fa-wallet"></i><span>Commission Management</span></a>
            <a href="#" class="text-slate-300 hover:text-accentBlue transition flex items-center space-x-2"><i class="fa-solid fa-comments"></i><span>Messaging Hub</span></a>
            <a href="#" class="text-slate-300 hover:text-accentBlue transition flex items-center space-x-2"><i class="fa-solid fa-headset"></i><span>Contact Admin</span></a>
        </nav>

        <!-- User Profile & Notifications -->
        <div class="flex items-center space-x-4">
            <button class="relative bg-slate-800 p-2.5 rounded-full hover:bg-slate-700 transition text-slate-300">
                <i class="fa-solid fa-bell"></i>
                <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full"></span>
            </button>
            <div class="flex items-center space-x-3 border-l border-borderSlate pl-4">
                <div class="w-9 h-9 rounded-full bg-accentBlue/20 text-accentBlue flex items-center justify-center font-bold">RG</div>
                <div class="hidden sm:block text-left">
                    <p class="text-xs font-semibold text-white">Roxroy Gough</p>
                    <p class="text-[10px] text-emerald-400 font-medium">Verified Shopper</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 space-y-8">
        <!-- Rest of the Shopper Dashboard contents remain here -->
    </main>

    <!-- Footer -->
    <footer class="border-t border-borderSlate bg-cardBg py-6 mt-12 text-center text-xs text-slate-500">
        <p>&copy; 2026 Echo Hub Marketplace. All rights reserved.</p>
    </footer>

</body>
</html>
