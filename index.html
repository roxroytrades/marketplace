<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>My Brand Store</h1>
        <nav>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main>
        <section>
            <h2>Featured Products</h2>
            <p>Discover our latest collection of high-quality items.</p>
        </section>

        <!-- Product Grid Container -->
        <section id="products">
            <div class="product-card">
                <h3>Product One</h3>
                <p>$29.99</p>
                <button>Buy Now</button>
            </div>
            
            <div class="product-card">
                <h3>Product Two</h3>
                <p>$49.99</p>
                <button>Buy Now</button>
            </div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My Brand Store. All rights reserved.</p>
    </footer>

</body>
</html>
