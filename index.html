<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inquiry & Verified Feedback</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin-bottom: 20px; color: #333; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Submit to Seller</h2>
        <form id="submissionForm">
            <label for="submissionType">Submission Type</label>
            <select id="submissionType" onchange="toggleFields()">
                <option value="inquiry">Regular Inquiry (Message)</option>
                <option value="feedback">Product Feedback (Amazon URL)</option>
            </select>
            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name..." required>
            <div id="dynamicFields">
                <label for="message">Your Message</label>
                <input type="text" id="message" placeholder="Ask a question..." required>
            </div>
            <button type="submit" id="submitBtn">Send to Seller</button>
        </form>
    </div>
    <script>
        const SUPABASE_URL = 'https://mjnwonkepgxhtdnxsrjw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbndvbmtlcGd4aHRkbnhzcmp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODIwMDEsImV4cCI6MjEwNTI1ODAwMX0.y8LcCQpS_DqKuYibh3YLXYyQz6KUI0XZLLs77tYdSy8';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleFields() {
            const type = document.getElementById('submissionType').value;
            const container = document.getElementById('dynamicFields');
            if (type === 'inquiry') {
                container.innerHTML = `<label for="message">Your Message</label><input type="text" id="message" placeholder="Ask a question..." required>`;
            } else {
                container.innerHTML = `<label for="amazonUrl">Amazon Product URL</label><input type="url" id="amazonUrl" placeholder="https://amazon.com/dp/..." required>`;
            }
        }

        const form = document.getElementById('submissionForm');
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            const type = document.getElementById('submissionType').value;
            const product = document.getElementById('productName').value;
            const contentValue = type === 'inquiry' ? document.getElementById('message').value : document.getElementById('amazonUrl').value;

            const response = await _supabase
                .from('submissions')
                .insert([{ type: type, product_name: product, content: contentValue }])
                .select();

            console.log("Saved Row Data:", response);

            if (response.error) {
                alert('Database Error: ' + response.error.message);
            } else {
                alert('Submitted successfully!');
                form.reset();
                toggleFields();
            }

            submitBtn.textContent = 'Send to Seller';
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
