<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <style>
        /* Global Styles (The whole page background and font) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Header / Navigation Styles */
        header {
            background-color: #1a1a1a;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        header nav a:hover {
            color: #007bff;
        }

        /* Main Section */
        main {
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        /* Product Grid Layout */
        #products {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        /* Individual Product Cards */
        .product-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 250px;
            text-align: left;
        }

        .product-card h3 {
            margin-top: 0;
            color: #1a1a1a;
        }

        .product-card p {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
        }

        /* Button Styling */
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Footer */
        footer {
            background-color: #ddd;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #555;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Brand Store</h1>
        <nav>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Featured Products</h2>
            <p>Discover our latest collection of high-quality items.</p>
        </section>

        <section id="products">
            <div class="product-card">
                <h3>Product One</h3>
                <p>$29.99</p>
                <button>Buy Now</button>
            </div>
            
            <div class="product-card">
                <h3>Product Two</h3>
                <p>$49.99</p>
                <button>Buy Now</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Brand Store. All rights reserved.</p>
    </footer>

</body>
</html>
