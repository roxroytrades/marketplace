<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inquiry & Verified Feedback</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .form-container, .feed-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin-bottom: 20px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #333; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .submission-card { background: #f8f9fa; border-left: 4px solid #007bff; padding: 12px; margin-bottom: 10px; border-radius: 4px; font-size: 14px; }
        .submission-card b { color: #333; }
        .badge { display: inline-block; padding: 2px 6px; font-size: 11px; font-weight: bold; color: white; border-radius: 3px; background: #28a745; margin-bottom: 6px; text-transform: uppercase; }
        .badge.inquiry { background: #17a2b8; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Submit to Seller</h2>
        <form id="submissionForm">
            <label for="submissionType">Submission Type</label>
            <select id="submissionType" onchange="toggleFields()">
                <option value="inquiry">Regular Inquiry (Message)</option>
                <option value="feedback">Product Feedback (Amazon URL)</option>
            </select>
            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name..." required>
            <div id="dynamicFields">
                <label for="message">Your Message</label>
                <input type="text" id="message" placeholder="Ask a question..." required>
            </div>
            <button type="submit" id="submitBtn">Send to Seller</button>
        </form>
    </div>

    <div class="feed-container">
        <h2>Recent Submissions</h2>
        <div id="submissionsFeed">Loading submissions...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mjnwonkepgxhtdnxsrjw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_f9Cb0CJCTdonBJ7UsxFqMA_S8DGmkpx';

        function toggleFields() {
            const type = document.getElementById('submissionType').value;
            const container = document.getElementById('dynamicFields');
            if (type === 'inquiry') {
                container.innerHTML = `<label for="message">Your Message</label><input type="text" id="message" placeholder="Ask a question..." required>`;
            } else {
                container.innerHTML = `<label for="amazonUrl">Amazon Product URL</label><input type="url" id="amazonUrl" placeholder="https://amazon.com/dp/..." required>`;
            }
        }

        async function fetchSubmissions() {
            const feedContainer = document.getElementById('submissionsFeed');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=created_at.desc&limit=5`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                const data = await res.json();
                if (!res.ok) {
                    feedContainer.innerHTML = 'Could not load submissions.';
                    return;
                }

                if (data.length === 0) {
                    feedContainer.innerHTML = '<p style="color: #666; font-style: italic;">No submissions yet. Be the first!</p>';
                    return;
                }

                feedContainer.innerHTML = data.map(item => `
                    <div class="submission-card">
                        <span class="badge ${item.type}">${item.type}</span><br>
                        <b>Product:</b> ${escapeHtml(item.product_name)}<br>
                        <b>Content:</b> ${escapeHtml(item.content)}
                    </div>
                `).join('');
            } catch (err) {
                feedContainer.innerHTML = 'Error loading feed.';
            }
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        const form = document.getElementById('submissionForm');
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            const type = document.getElementById('submissionType').value;
            const product = document.getElementById('productName').value;
            const contentValue = type === 'inquiry' ? document.getElementById('message').value : document.getElementById('amazonUrl').value;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        type: type,
                        product_name: product,
                        content: contentValue
                    })
                });

                if (!res.ok) {
                    const data = await res.json();
                    alert('Database Error: ' + (data.message || JSON.stringify(data)));
                } else {
                    form.reset();
                    toggleFields();
                    fetchSubmissions(); // Refresh the feed immediately
                }
            } catch (err) {
                alert('Network Error: ' + err.message);
            }

            submitBtn.textContent = 'Send to Seller';
            submitBtn.disabled = false;
        });

        // Load submissions on page load
        fetchSubmissions();
    </script>
</body>
</html>
