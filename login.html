<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Shopper & Reviewer Sign In</title>
    <!-- Tailwind CSS CDN with Dark Mode Enabled -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0F172A',
                        cardBg: '#1E293B',
                        accentBlue: '#2563EB',
                        accentHover: '#1D4ED8',
                        borderSlate: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter / Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Top Bar -->
    <header class="bg-cardBg border-b border-borderSlate px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20 font-heading font-bold text-lg">
                eh
            </div>
            <span class="font-heading text-xl font-bold tracking-wide text-white">echo<span class="text-blue-500">hub</span> <span class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-full ml-2">Shopper Portal</span></span>
        </div>
        
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center space-x-1">
                <i class="fa-solid fa-arrow-left"></i><span>Back to Shopper Dashboard</span>
            </a>
        </div>
    </header>

    <!-- Main Authentication Container -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-cardBg border border-borderSlate rounded-2xl shadow-2xl p-8 space-y-6">
            
            <!-- Header Branding inside Card -->
            <div class="text-center space-y-2">
                <div class="inline-flex w-14 h-14 bg-blue-600 rounded-2xl items-center justify-center text-white shadow-lg shadow-blue-500/25 mb-2 font-heading font-bold text-2xl">
                    eh
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Shopper Portal Login</h1>
                <p class="text-xs text-slate-400">Sign in to manage your marketplace commissions, product reviews, and rewards.</p>
            </div>

            <!-- Feedback Alert Box -->
            <div id="loginAlert" class="hidden p-3 rounded-xl text-xs font-medium"></div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300">Buyer Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-envelope text-xs"></i></span>
                        <input type="email" id="loginEmail" required placeholder="shopper@example.com" class="w-full bg-darkBg border border-borderSlate rounded-xl pl-10 pr-4 py-3 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                </div>

                <div class="space-y-1">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-slate-300">Password</label>
                        <a href="#" class="text-[11px] text-accentBlue hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock text-xs"></i></span>
                        <input type="password" id="loginPassword" required placeholder="••••••••••••" class="w-full bg-darkBg border border-borderSlate rounded-xl pl-10 pr-4 py-3 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-accentBlue hover:bg-accentHover text-white font-semibold text-xs py-3 rounded-xl shadow-lg shadow-blue-500/25 transition flex items-center justify-center space-x-2 mt-2">
                    <span>Sign In to Shopper Dashboard</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-borderSlate"></div>
                <span class="flex-shrink mx-4 text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Or continue with</span>
                <div class="flex-grow border-t border-borderSlate"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="bg-darkBg hover:bg-slate-800 border border-borderSlate py-2.5 rounded-xl text-xs font-medium text-slate-300 transition flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-google text-slate-400"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="bg-darkBg hover:bg-slate-800 border border-borderSlate py-2.5 rounded-xl text-xs font-medium text-slate-300 transition flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-discord text-blue-400"></i>
                    <span>Discord</span>
                </button>
            </div>

            <p class="text-center text-xs text-slate-400 pt-2">
                Don't have a buyer account? <a href="buyer-register.html" class="text-accentBlue font-semibold hover:underline">Create an account</a>
            </p>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-borderSlate bg-cardBg py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Echo Hub Marketplace. Secure Shopper Portal.</p>
    </footer>

    <!-- Supabase Integration Script -->
    <script>
        const SUPABASE_URL = 'https://mjnwonkepgxhtdnxsrjw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_f9Cb0CJCTdonBJ7UsxFqMA_S8DGmkpx';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            // UI Loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Signing In...';
            loginAlert.classList.add('hidden');

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Success State
                loginAlert.className = 'p-3 rounded-xl text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                loginAlert.textContent = 'Login successful! Redirecting to dashboard...';
                loginAlert.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (err) {
                // Error State
                loginAlert.className = 'p-3 rounded-xl text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20';
                loginAlert.textContent = err.message || 'Invalid email or password. Please try again.';
                loginAlert.classList.remove('hidden');

                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Sign In to Shopper Dashboard</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>';
            }
        });
    </script>
</body>
</html>
