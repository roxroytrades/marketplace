<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Authentication Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0F172A',
                        cardBg: '#1E293B',
                        accentBlue: '#2563EB',
                        accentHover: '#1D4ED8',
                        borderSlate: '#334155'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Top Bar -->
    <header class="bg-cardBg border-b border-borderSlate px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20 font-heading font-bold text-lg">
                eh
            </div>
            <span class="font-heading text-xl font-bold tracking-wide text-white">echo<span class="text-blue-500">hub</span></span>
        </div>
        
        <div class="flex items-center space-x-3">
            <span class="text-xs text-slate-400 hidden sm:inline">Quick Preview Switcher:</span>
            <select onchange="if(this.value) window.location.href=this.value;" class="bg-slate-800 border border-borderSlate text-slate-200 text-xs rounded-xl px-3 py-2 outline-none focus:border-accentBlue font-medium">
                <option value="login.html" selected>Login Portal</option>
                <option value="index.html">Shopper Dashboard</option>
                <option value="seller.html">Seller Dashboard</option>
                <option value="admin.html">Admin Panel</option>
            </select>
        </div>
    </header>

    <!-- Main Authentication Container -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-cardBg border border-borderSlate rounded-2xl shadow-2xl p-8 space-y-6">
            
            <!-- Header Branding inside Card -->
            <div class="text-center space-y-2">
                <div class="inline-flex w-14 h-14 bg-blue-600 rounded-2xl items-center justify-center text-white shadow-lg shadow-blue-500/25 mb-2 font-heading font-bold text-2xl">
                    eh
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Welcome to echo hub</h1>
                <p class="text-xs text-slate-400">Sign in to manage your marketplace commissions, reviews, and store payouts.</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="grid grid-cols-3 gap-2 bg-slate-900/60 p-1.5 rounded-xl border border-borderSlate text-xs font-medium text-center">
                <button type="button" class="py-2 rounded-lg bg-accentBlue text-white shadow transition">Shopper</button>
                <button type="button" class="py-2 rounded-lg text-slate-400 hover:text-white transition">Seller</button>
                <button type="button" class="py-2 rounded-lg text-slate-400 hover:text-white transition">Admin</button>
            </div>

            <!-- Login Form -->
            <form class="space-y-4" onsubmit="event.preventDefault(); window.location.href='index.html';">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-envelope text-xs"></i></span>
                        <input type="email" required placeholder="roxroy@example.com" class="w-full bg-darkBg border border-borderSlate rounded-xl pl-10 pr-4 py-3 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                </div>

                <div class="space-y-1">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-slate-300">Password</label>
                        <a href="#" class="text-[11px] text-accentBlue hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock text-xs"></i></span>
                        <input type="password" required placeholder="••••••••••••" class="w-full bg-darkBg border border-borderSlate rounded-xl pl-10 pr-4 py-3 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-accentBlue hover:bg-accentHover text-white font-semibold text-xs py-3 rounded-xl shadow-lg shadow-blue-500/25 transition flex items-center justify-center space-x-2 mt-2">
                    <span>Sign In to Dashboard</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-borderSlate"></div>
                <span class="flex-shrink mx-4 text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Or continue with</span>
                <div class="flex-grow border-t border-borderSlate"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="bg-darkBg hover:bg-slate-800 border border-borderSlate py-2.5 rounded-xl text-xs font-medium text-slate-300 transition flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-google text-slate-400"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="bg-darkBg hover:bg-slate-800 border border-borderSlate py-2.5 rounded-xl text-xs font-medium text-slate-300 transition flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-discord text-blue-400"></i>
                    <span>Discord</span>
                </button>
            </div>

            <p class="text-center text-xs text-slate-400 pt-2">
                Don't have an account yet? <a href="buyer-register.html" class="text-accentBlue font-semibold hover:underline">Create an account</a>
            </p>

        </div>
    </main>

    <footer class="border-t border-borderSlate bg-cardBg py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 echo hub Marketplace. Secure Access Portal.</p>
    </footer>

</body>
</html>
