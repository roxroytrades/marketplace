<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Private Seller & Vendor Registration</title>
    <!-- Tailwind CSS CDN with Dark Mode Enabled -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0F172A',
                        cardBg: '#1E293B',
                        accentBlue: '#2563EB',
                        accentHover: '#1D4ED8',
                        borderSlate: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter / Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar (Private Invite Badge) -->
    <header class="bg-cardBg border-b border-borderSlate px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-blue-500/20 relative">
                <i class="fa-solid fa-comment text-sm"></i>
                <div class="absolute -bottom-1 -left-1 w-3 h-3 bg-blue-600 transform rotate-45"></div>
            </div>
            <span class="font-heading text-xl font-bold tracking-wide text-white">Echo<span class="text-blue-500">Hub</span> <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full ml-2">Private Vendor Invite</span></span>
        </div>
        <div class="text-xs text-slate-400">
            Vendor Sign-In? <a href="login.html" class="text-accentBlue font-semibold hover:underline ml-1">Access Portal</a>
        </div>
    </header>

    <!-- Main Registration Container -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="max-w-xl w-full bg-cardBg border border-borderSlate rounded-2xl shadow-2xl p-8 space-y-6">
            
            <div class="text-center space-y-2">
                <div class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-1">
                    <i class="fa-solid fa-key text-[10px]"></i> <span>Private Invite Link Verified</span>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Seller Store Onboarding</h1>
                <p class="text-xs text-slate-400">Set up your vendor profile, define payout structures, and list your products securely.</p>
            </div>

            <!-- Seller Registration Form -->
            <form class="space-y-4" onsubmit="event.preventDefault(); alert('Seller store registered successfully!'); window.location.href='seller.html';">
                
                <!-- Name Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">First Name</label>
                        <input type="text" required placeholder="Roxroy" class="w-full bg-darkBg border border-borderSlate rounded-xl px-4 py-2.5 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">Last Name</label>
                        <input type="text" required placeholder="Gough" class="w-full bg-darkBg border border-borderSlate rounded-xl px-4 py-2.5 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                </div>

                <!-- Vendor Type Radio Select -->
                <div class="space-y-2 pt-1">
                    <label class="text-xs font-semibold text-slate-300">Vendor Type</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center space-x-3 p-3 rounded-xl border border-borderSlate bg-darkBg cursor-pointer hover:border-accentBlue transition">
                            <input type="radio" name="vendorType" value="UPFRONT" required class="text-accentBlue focus:ring-0">
                            <span class="text-xs font-medium text-slate-200">UPFRONT</span>
                        </label>
                        <label class="flex items-center space-x-3 p-3 rounded-xl border border-borderSlate bg-darkBg cursor-pointer hover:border-accentBlue transition">
                            <input type="radio" name="vendorType" value="REFUND_AFTER_REVIEW" required class="text-accentBlue focus:ring-0">
                            <span class="text-xs font-medium text-slate-200">REFUND AFTER REVIEW</span>
                        </label>
                    </div>
                </div>

                <!-- Commission Amount & Referral Code -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">Commission Amount (USD) <span class="text-slate-500 font-normal">(Min $5.00)</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">$</span>
                            <input type="number" min="5.00" step="0.01" required placeholder="5.00" class="w-full bg-darkBg border border-borderSlate rounded-xl pl-8 pr-4 py-2.5 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">Referral Code <span class="text-slate-500 font-normal">(Optional)</span></label>
                        <input type="text" id="sellerRefCode" placeholder="REF-XXXX" class="w-full bg-darkBg border border-borderSlate rounded-xl px-4 py-2.5 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                </div>

                <!-- Offerings / Business Description -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300">Offerings / Business Description</label>
                    <textarea rows="3" required placeholder="Describe your brand, Amazon product catalogs, and review campaign requirements..." class="w-full bg-darkBg border border-borderSlate rounded-xl p-3 text-xs text-slate-200 outline-none focus:border-accentBlue transition resize-none"></textarea>
                </div>

                <!-- Emails Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">Account Email (Vendor Login)</label>
                        <input type="email" required placeholder="store@example.com" class="w-full bg-darkBg border border-borderSlate rounded-xl px-4 py-2.5 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">PayPal Email (Billing / Transfers)</label>
                        <input type="email" required placeholder="store-billing@example.com" class="w-full bg-darkBg border border-borderSlate rounded-xl px-4 py-2.5 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300">Password</label>
                    <input type="password" required placeholder="••••••••••••" class="w-full bg-darkBg border border-borderSlate rounded-xl px-4 py-2.5 text-xs text-slate-200 outline-none focus:border-accentBlue transition">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs py-3 rounded-xl shadow-lg shadow-emerald-600/25 transition flex items-center justify-center space-x-2 mt-4">
                    <span>Initialize Seller Store Onboarding</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-borderSlate bg-cardBg py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Echo Hub Marketplace. Private Vendor Onboarding.</p>
    </footer>

    <script>
        // Auto-capture referral code from URL query parameter ?ref=CODE
        const urlParams = new URLSearchParams(window.location.search);
        const refParam = urlParams.get('ref');
        if (refParam) {
            document.getElementById('sellerRefCode').value = refParam;
        }
    </script>
</body>
</html>
