<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Vendor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --dark: #1a1a1a;
            --bg-light: #f4f4f9;
            --sidebar-width: 270px;
        }
        body { font-family: Arial, sans-serif; background-color: var(--bg-light); margin: 0; padding: 0; color: #333; display: flex; height: 100vh; overflow: hidden; }
        aside { width: var(--sidebar-width); background: var(--dark); color: white; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        aside h2 { font-size: 20px; margin-top: 0; color: #00bcd4; }
        aside .nav-tag { font-size: 11px; text-transform: uppercase; background: #00bcd4; color: black; padding: 2px 6px; border-radius: 3px; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        aside nav button { background: none; border: none; color: #ccc; text-align: left; padding: 12px 10px; font-size: 14px; cursor: pointer; border-radius: 4px; margin-bottom: 5px; width: 100%; transition: 0.2s; }
        aside nav button:hover, aside nav button.active { background: rgba(255,255,255,0.1); color: white; font-weight: bold; }
        aside .back-link { margin-top: auto; color: #aaa; text-decoration: none; font-size: 13px; padding-top: 15px; border-top: 1px solid #333; }
        aside .back-link:hover { color: white; }

        main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        header { background: white; padding: 15px 30px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 22px; margin: 0; }
        .view-section { padding: 30px; box-sizing: border-box; width: 100%; max-width: 800px; }

        .form-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .form-group textarea { resize: vertical; height: 100px; }
        button.btn { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button.btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <aside>
        <h2>Echo Hub</h2>
        <span class="nav-tag">Vendor Dashboard</span>
        <nav>
            <button class="active">Create Product Listing</button>
        </nav>
        <a href="index.html" class="back-link">&larr; Switch to User Storefront</a>
    </aside>

    <main>
        <header>
            <h1>Product Listing Manager</h1>
            <span style="font-size: 13px; color: #666;">Logged in as Vendor</span>
        </header>

        <section class="view-section">
            <div class="form-card">
                <h3>Add New Product to the Grid</h3>
                <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Fill out the controls below. Submitting will publish the listing live to the marketplace product grid and dispatch a notification to all reviewers.</p>
                
                <div class="form-group">
                    <label for="productTitle">Product Title</label>
                    <input type="text" id="productTitle" placeholder="e.g., Premium Amazon Review Scanner Bot">
                </div>

                <div class="form-group">
                    <label for="productPrice">Price ($)</label>
                    <input type="number" id="productPrice" step="0.01" placeholder="49.99">
                </div>

                <div class="form-group">
                    <label for="productCategory">Category</label>
                    <input type="text" id="productCategory" placeholder="e.g., Automation / Software">
                </div>

                <div class="form-group">
                    <label for="productDesc">Description</label>
                    <textarea id="productDesc" placeholder="Enter full product details..."></textarea>
                </div>

                <button class="btn" onclick="submitProductListing()">Submit Listing</button>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://mjnwonkepgxhtdnxsrjw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_f9Cb0CJCTdonBJ7UsxFqMA_S8DGmkpx';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function submitProductListing() {
            const title = document.getElementById('productTitle').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const category = document.getElementById('productCategory').value.trim();
            const description = document.getElementById('productDesc').value.trim();

            if (!title || isNaN(price)) {
                alert("Please fill in at least the product title and a valid price.");
                return;
            }

            // 1. Insert product into database
            const { error: prodError } = await supabaseClient.from('products').insert([{
                title,
                price,
                category,
                description
            }]);

            if (prodError) {
                alert("Error saving product: " + prodError.message);
                return;
            }

            // 2. Broadcast notification to all non-vendor users
            const { error: notifError } = await supabaseClient.from('notifications').insert([{
                title: 'New Product Available!',
                message: `Vendor added a new listing: "${title}" for $${price.toFixed(2)}.`
            }]);

            if (notifError) {
                console.error("Error creating notification:", notifError);
            }

            alert("Product successfully published to the grid and notification broadcasted!");
            
            // Clear inputs
            document.getElementById('productTitle').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productCategory').value = '';
            document.getElementById('productDesc').value = '';
        }
    </script>
</body>
</html>
